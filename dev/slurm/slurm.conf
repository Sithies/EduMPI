# Slurm 23.11 (Ubuntu 24.04) für den lokalen Dev-Cluster: login + node1..node4.
# In allen Containern identisch. Ohne cgroups, damit es unprivilegiert in Docker und Podman läuft.
ClusterName=edumpi
SlurmctldHost=login
AuthType=auth/munge
CredType=cred/munge
SlurmUser=slurm
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
# Keine Log-Dateien: Logs gehen nach stderr (compose logs)

ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
AccountingStorageType=accounting_storage/none
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
# Ohne Accounting überspringt der Haupt-Scheduler Jobs ("invalid account") und erst Backfill
# startet sie – Standard alle 30 s; so starten Jobs nach ca. 1 s
SchedulerParameters=bf_interval=1
# Die GUI startet mit mpirun (PRRTE startet seine Daemons per srun --mpi=none)
MpiDefault=none
# Nodes nach Container-Neustart sofort wieder verfügbar
ReturnToService=2
# CPUs/RAM aus dieser Datei statt der erkannten Hardware (sonst DRAIN in VMs/Containern)
SlurmdParameters=config_overrides
MailProg=/bin/true

# 4 CPUs je Node: die GUI fordert 2 CPUs pro Rank an (--cpus-per-task=2), also bis 8 Ranks
NodeName=node[1-4] CPUs=4 RealMemory=2000 State=UNKNOWN
# Die GUI schickt Jobs fest an die Partition "all"
PartitionName=all Nodes=node[1-4] Default=YES MaxTime=INFINITE State=UP
