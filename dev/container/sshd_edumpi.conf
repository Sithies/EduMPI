# SSH-Login in den Dev-Cluster: nur per Key, Keys liegen im Image (nicht im geteilten /home)
HostKey /etc/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Kein Banner/MOTD: die GUI liest Job-IDs aus der Ausgabe von ssh
PrintMotd no
PrintLastLog no
